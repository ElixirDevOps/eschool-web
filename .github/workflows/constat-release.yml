# constat:template id=node-release-workflow version=39 sha256=c4a27d64b0fcfaee8d0ff71160d299e696b989b6a669a627a44611202e5a3a61
name: constat-release
# Generated by Constat. Pressed by the constat-runner workflow after it has merged a released
# attempt into the default branch (Release with no hands, 2 September 2026). Constat presses
# nothing itself and never deploys: the step below is YOUR deploy, and Constat then witnesses the
# running app answering with the merged commit at the project's live address (GET /api/v1/version).
#
# A release does TWO things where a product publishes something as well as deploying it, and
# Constat records them separately (22 September 2026). The `release` input below is the id of the
# Constat release this deploy is of: the runner hands it over because this file asks for it. A
# deploy that wants to say what it deployed and what it published, in its own words, posts them to
# Constat at the end of the job, with GitHub's own identity token and no secret:
#
#   POST <constat>/api/v1/runner/releases/${{ inputs.release }}/outcomes
#   {"deployment":{"outcome":"done","words":"…"},"publish":{"outcome":"nothing_to_publish","words":"…"}}
#
# A deploy that says nothing is not a failure: the release shows what Constat witnessed, as always.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The Constat release this deploy is of. Empty when you press Run yourself.
        required: false
        default: ''
permissions:
  contents: read
  # Only needed by a deploy that reports its own outcomes to Constat, as above.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    # Only the default branch is ever released. A press on any other ref — by a runner, a person,
    # or a mistake — does nothing here, so an unjudged branch cannot reach your users through this door.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
      - name: Your deploy
        run: |
          echo "::error::Write your deploy here — this step is where your application goes live. Until it exists, Constat shows the release as merged and never live."
          exit 1
